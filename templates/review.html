{% extends "base.html" %}

{% block title %}Review &amp; Apply - Redirector 301{% endblock %}
{% block page_title %}Redirector 301{% endblock %}

{% block header_stats %}
<div class="stats-tabs flex items-center gap-xs">
  <button class="stat-tab flex items-center gap-xs px-3 py-1.5 rounded-lg text-xs font-semibold transition-all" data-filter="all" onclick="navToFilter('all')" title="Show all broken links in total">
    <span class="material-symbols-outlined text-[16px]">list</span>
    <b id="stat-total">0</b> total
  </button>
  <button class="stat-tab flex items-center gap-xs px-3 py-1.5 rounded-lg text-xs font-semibold transition-all" data-filter="applied" onclick="navToFilter('applied')" title="Show live redirects applied to Shopify">
    <span class="material-symbols-outlined text-[16px] text-emerald-500">check_circle</span>
    <b id="stat-applied">0</b> applied
  </button>
  <button class="stat-tab flex items-center gap-xs px-3 py-1.5 rounded-lg text-xs font-semibold transition-all" data-filter="confirmed" onclick="navToFilter('confirmed')" title="Show confirmed redirects ready to apply">
    <span class="material-symbols-outlined text-[16px] text-blue-500">verified</span>
    <b id="stat-confirmed">0</b> confirmed
  </button>
  <button class="stat-tab flex items-center gap-xs px-3 py-1.5 rounded-lg text-xs font-semibold transition-all" data-filter="pending" onclick="navToFilter('pending')" title="Show pending broken links requiring review">
    <span class="material-symbols-outlined text-[16px] text-amber-500 animate-pulse">hourglass_empty</span>
    <b id="stat-pending">0</b> pending
  </button>
</div>
{% endblock %}

{% block content %}
<main class="max-w-[1240px] w-full mx-auto p-4 md:p-6 flex flex-col gap-6">
  <!-- Instant Fix & Action Control Bar (Material 3 Bento) -->
  <section class="bg-surface/90 backdrop-blur-md border border-outline-variant rounded-2xl p-4 flex flex-col lg:flex-row items-center justify-between gap-4 shadow-sm transition-all hover:shadow-md">
    <div class="flex-1 w-full relative group">
      <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-primary transition-transform group-focus-within:scale-110">link</span>
      <input id="instant-input" class="w-full bg-surface-container-lowest border border-outline-variant pl-11 pr-28 py-3 rounded-xl text-sm font-medium focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none shadow-inner placeholder:text-on-surface-variant/60" placeholder="Paste a broken link for an instant match (e.g. /products/old-slug)..." type="text" onkeyup="if(event.key==='Enter') instantFix()">
      <button class="absolute right-2 top-1/2 -translate-y-1/2 px-4 py-1.5 bg-primary text-on-primary rounded-lg text-xs font-semibold hover:bg-primary/90 transition-all active:scale-95 shadow-sm" onclick="instantFix()">Find match</button>
    </div>

    <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto shrink-0">
      <label class="flex items-center gap-1.5 px-3.5 py-2 border border-outline-variant text-primary rounded-xl text-xs font-semibold hover:bg-surface-container-low hover:border-primary/50 cursor-pointer active:scale-95 transition-all bg-surface-container-lowest shadow-sm" title="Upload broken URLs file (.xlsx, .csv, .txt)">
        <span class="material-symbols-outlined text-[18px]">upload_file</span>
        Upload File
        <input type="file" id="file-uploader" accept=".xlsx,.xls,.csv,.txt" onchange="uploadBrokenFile(this)" style="display:none;">
      </label>

      <button class="flex items-center gap-1.5 px-3.5 py-2 border border-outline-variant text-primary rounded-xl text-xs font-semibold hover:bg-surface-container-low hover:border-primary/50 active:scale-95 transition-all bg-surface-container-lowest shadow-sm" id="check-http-btn" onclick="checkAllHttpStatuses()" title="Automatically send HEAD requests to test if URLs return 200 OK or 404 Not Found">
        <span class="material-symbols-outlined text-[18px]">network_check</span>
        ⚡ Check HTTP (200/404)
      </button>

      <button class="p-2 border border-outline-variant text-on-surface-variant rounded-xl hover:bg-surface-container-low hover:text-primary active:scale-95 transition-all bg-surface-container-lowest shadow-sm" id="rematch-btn" onclick="triggerRematch(false)" title="Rerun matching algorithm against catalog & pattern rules">
        <span class="material-symbols-outlined text-[18px]">refresh</span>
      </button>

      <button class="p-2 border border-outline-variant text-on-surface-variant rounded-xl hover:bg-surface-container-low hover:text-primary active:scale-95 transition-all bg-surface-container-lowest shadow-sm" id="refetch-rematch-btn" onclick="triggerRematch(true)" title="Sync fresh products from Shopify API then rerun matching">
        <span class="material-symbols-outlined text-[18px]">sync</span>
      </button>

      <div class="w-px h-6 bg-outline-variant mx-1 hidden lg:block"></div>

      <button class="flex items-center gap-1.5 px-5 py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold hover:bg-emerald-700 active:scale-95 transition-all shadow-sm" onclick="applyAllConfirmed()">
        <span class="material-symbols-outlined text-[18px]">done_all</span>
        Apply All Confirmed
      </button>
    </div>
  </section>

  <!-- Filters & Export Toolbar -->
  <section class="flex flex-col md:flex-row items-center justify-between gap-3 bg-surface border border-outline-variant rounded-2xl p-3 shadow-sm">
    <div class="flex items-center gap-2 w-full md:w-auto">
      <div class="relative w-full md:w-64 group">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px] group-focus-within:text-primary transition-colors">search</span>
        <input id="search" class="w-full bg-surface-container-lowest border border-outline-variant pl-9 pr-3 py-1.5 rounded-xl text-xs font-medium focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="Search broken URL or product..." type="text">
      </div>

      <select id="filter" class="bg-surface-container-lowest border border-outline-variant text-on-surface rounded-xl px-3 py-1.5 text-xs font-medium focus:border-primary focus:ring-1 focus:ring-primary outline-none cursor-pointer">
        <option value="pending" selected>Pending only</option>
        <option value="confirmed">Confirmed (not yet applied)</option>
        <option value="applied">Applied (live on Shopify)</option>
        <option value="all">All broken links (Total)</option>
        <option value="skipped">Skipped (already on Shopify)</option>
        <option value="ignored">Ignored (Don't Redirect)</option>
        <option value="rejected">Rejected</option>
        <option value="error">Errors</option>
        <option value="low">Low confidence (&lt;50%)</option>
      </select>

      <select id="page-size" class="bg-surface-container-lowest border border-outline-variant text-on-surface rounded-xl px-3 py-1.5 text-xs font-medium focus:border-primary outline-none cursor-pointer">
        <option value="10">10 / page</option>
        <option value="25" selected>25 / page</option>
        <option value="50">50 / page</option>
        <option value="100">100 / page</option>
        <option value="all">Show all</option>
      </select>
    </div>

    <div class="flex items-center gap-2 w-full md:w-auto justify-end">
      <span class="text-xs font-medium text-on-surface-variant hidden md:inline">Export:</span>
      <select id="export-scope" class="bg-surface-container-lowest border border-outline-variant text-on-surface rounded-xl px-3 py-1.5 text-xs font-medium outline-none">
        <option value="all">All rows</option>
        <option value="applied">Applied only</option>
        <option value="confirmed">Confirmed only</option>
        <option value="pending">Pending only</option>
        <option value="ignored">Ignored only</option>
      </select>
      <select id="export-format" class="bg-surface-container-lowest border border-outline-variant text-on-surface rounded-xl px-3 py-1.5 text-xs font-medium outline-none">
        <option value="xlsx">Excel (.xlsx)</option>
        <option value="csv">CSV (.csv)</option>
      </select>
      <button class="flex items-center gap-1 px-3 py-1.5 bg-surface-container-high border border-outline-variant text-on-surface rounded-xl text-xs font-semibold hover:bg-surface-container-highest transition-all" onclick="downloadExport()" title="Download report">
        <span class="material-symbols-outlined text-[16px]">download</span>
        Export
      </button>
    </div>
  </section>

  <!-- Dynamic Product Cards List Container -->
  <section class="flex flex-col gap-3">
    <div id="list" class="flex flex-col gap-3"></div>
    <div id="pagination-bottom" class="pagination-bar flex items-center justify-between p-3 bg-surface border border-outline-variant rounded-2xl text-xs font-medium" style="display:none;"></div>
  </section>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/review.js') }}"></script>
{% endblock %}
